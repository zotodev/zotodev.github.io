<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/zoto.9d944cf2c963.jpeg' | absolute_url }}">
    <meta property="og:image:alt" content="Zoto brand logo">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ '/assets/zoto.9d944cf2c963.jpeg' | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    {% if page.layout == 'post' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
    <link rel="icon" href="{{ '/assets/zoto.9d944cf2c963.jpeg' | relative_url }}" type="image/jpeg">
    <link rel="alternate" type="application/rss+xml" title="Zoto Blog" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script type="module" src="{{ "/assets/search.mjs" | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Zoto Blog home"><img src="{{ '/assets/zoto.9d944cf2c963.jpeg' | relative_url }}" alt="Zoto" width="40" height="40"></a>
        <form class="search-form" action="{{ '/' | relative_url }}" role="search">
          <label class="sr-only" for="search">Search posts</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search" name="q" type="search" placeholder="Search titles…" autocomplete="off" aria-describedby="search-hint">
          <span class="sr-only" id="search-hint">Search published post titles.</span>
          <noscript><span class="no-script">Enable JavaScript to search.</span></noscript>
        </form>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" hidden>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.7 13A9 9 0 0 1 11 3.3 9 9 0 1 0 20.7 13Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        </button>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ site.time | date: '%Y' }} Zoto</span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
  </body>
</html>
